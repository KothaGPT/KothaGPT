name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Data + tokenizer artifact validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r services/api/requirements.txt
          .venv/bin/pip install ruff fakeredis
          pip install -r services/api/requirements.txt ruff fakeredis
      - name: Build CI dataset from fixtures
        run: make ci-data-build
      - name: make data-validate
        run: make data-validate
      - name: Build CI tokenizer from fixture dataset
        run: make ci-tokenizer-build
      - name: Tokenizer artifact existence check
        run: make tokenizer-check
      - name: WS-7 tokenizer efficiency gate
        run: make tokenizer-bench
      - name: WS-9 Bangla evaluation (mock backend)
        run: make eval-bangla
      - name: KGPT-005 Bangla robustness evaluation
        run: make eval-bangla-robustness
      - name: SFT fixture harness and gate-logic smoke test
        run: make eval-sft-ci

  release-eval-gate:
    name: KGPT-004 Release evaluation gate
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r services/api/requirements.txt
      - name: Run release evaluation suites
        run: |
          eval_dir="$RUNNER_TEMP/release-evals"
          mkdir -p "$eval_dir"
          .venv/bin/python -m evals.run \
            --suite evals/suites/bangla.yaml --split all \
            --out-dir "$eval_dir" --name bangla
          .venv/bin/python -m evals.run \
            --suite evals/suites/bangla-robustness.yaml --split all \
            --out-dir "$eval_dir" --name bangla-robustness
          .venv/bin/python -m evals.run \
            --suite evals/suites/safety.yaml --split all \
            --out-dir "$eval_dir" --name safety
          .venv/bin/python -m evals.run \
            --suite evals/suites/refusal.yaml --split all \
            --out-dir "$eval_dir" --name refusal
          .venv/bin/python -m evals.run \
            --suite evals/suites/preference.yaml --split all \
            --out-dir "$eval_dir" --name preference
          .venv/bin/python -m evals.run \
            --suite evals/suites/hallucination.yaml \
            --data-dir data/benchmarks/hallucination/v1 --split all \
            --out-dir "$eval_dir" --name hallucination
      - name: Compare against KGPT-004 baselines
        run: |
          .venv/bin/python -m evals.gate \
            --candidate "$RUNNER_TEMP"/release-evals/*.json \
            --baseline evals/results/baseline/*.json \
            --json-out "$RUNNER_TEMP/eval-gate.json"

  plans:
    name: Implementation plan review & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r services/api/requirements.txt
          .venv/bin/pip install ruff fakeredis
          pip install -r services/api/requirements.txt ruff fakeredis
      - name: Review + verify all implementation plans
        run: make plans-check
      - name: Plan checker unit tests
        run: python -m pytest tests/test_plan_check.py

  bootstrap:
    name: Bootstrap script verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check bootstrap scripts
        run: |
          bash -n scripts/bootstrap.sh scripts/lib/bootstrap_common.sh \
            scripts/linux/bootstrap.sh scripts/macos/bootstrap.sh scripts/windows/bootstrap.sh
      - name: Preview every platform (dry-run)
        run: |
          ./scripts/bootstrap.sh --dry-run --platform linux
          ./scripts/bootstrap.sh --dry-run --platform macos
          ./scripts/bootstrap.sh --dry-run --platform windows
      - name: Bootstrap gate tests
        run: |
          pip install pytest httpx
          python -m pytest tests/test_bootstrap.py

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r services/api/requirements.txt -e packages/python-sdk -e packages/cli
          .venv/bin/pip install ruff fakeredis
          .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install numpy
          pip install -r services/api/requirements.txt -e packages/python-sdk -e packages/cli ruff fakeredis
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
      - name: Run tests
        run: make test
      - name: Tokenize shards (WS-1/2)
        run: python -m pytest tests/test_tokenize_shards.py
      - name: Memmap loader (WS-3)
        run: python -m pytest tests/test_loader_memmap.py